services:
  - type: web
    name: apex-nutrition-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apex-nutrition-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: USDA_API_KEY
        sync: false

databases:
  - name: apex-nutrition-db
    databaseName: apex_nutrition
    user: apex_user
    plan: free